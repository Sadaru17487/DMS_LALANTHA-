{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - LALANTHA DISTRIBUTORS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("{% static 'core/images/dark-city-4k-h7zudtwx4f8a03hy.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        
        /* Dark overlay for better text readability */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }
        
        .login-container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(2px);
        }
        
        .login-container .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-container .logo img {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 10px;
        }
        .login-container .logo .brand-text {
            font-size: 24px;
            font-weight: 700;
            color: #1a2634;
            letter-spacing: 1px;
        }
        .login-container .logo .brand-sub {
            font-size: 13px;
            color: #777;
            letter-spacing: 2px;
        }
        
        .login-container h1 {
            color: #1a2634;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }
        .login-container .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e4eb;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.2s;
            background: #fafbfc;
        }
        .form-group input:focus {
            border-color: #007bff;
            outline: none;
            background: white;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #0056b3;
        }
        .msg {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .msg.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .msg.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .msg.info {
            background: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #999;
        }
        .footer a {
            color: #007bff;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 25px;
                margin: 15px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Logo Area -->
    <div class="logo">
        {% load static %}
        <img src="{% static 'core/images/logo.jpeg' %}" alt="LALANTHA DISTRIBUTORS">
    </div>

    <p class="subtitle">Distribution Management System</p>
    
    {% if messages %}
        {% for message in messages %}
            <div class="msg {% if message.tags == 'error' %}error{% elif message.tags == 'info' %}info{% else %}success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="/login/">
        {% csrf_token %}
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn">🔑 Login</button>
    </form>
    
    <div class="footer">
        <p>Default Admin: <strong>admin</strong> / <strong>admin123</strong></p>
        <p><a href="/admin">Admin Panel</a> | <a href="/register">Register New User</a></p>
    </div>
</div>

</body>
</html>
