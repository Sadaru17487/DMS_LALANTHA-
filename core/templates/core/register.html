<!DOCTYPE html>
<html>
<head>
    <title>Register User - DMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); width: 100%; max-width: 450px; }
        .container h1 { color: #1a2634; font-size: 24px; font-weight: 600; margin-bottom: 8px; text-align: center; }
        .container .subtitle { text-align: center; color: #777; margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; color: #444; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 16px; border: 2px solid #e0e4eb; border-radius: 8px; font-size: 15px; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: #007bff; outline: none; }
        .btn { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #218838; }
        .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 15px; font-weight: 500; }
        .msg.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .msg.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .footer { text-align: center; margin-top: 20px; font-size: 13px; color: #999; }
        .footer a { color: #007bff; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h1>👤 Register New User</h1>
    <p class="subtitle">Create a new user account with role-based permissions</p>
    
    {% if messages %}
        {% for message in messages %}
            <div class="msg {% if message.tags == 'error' %}error{% else %}success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="password2" placeholder="Confirm password" required>
        </div>
        <div class="form-group">
            <label>Role</label>
            <select name="role">
                <option value="Admin">Admin - Full Access</option>
                <option value="Accountant">Accountant - Sales & Reports</option>
                <option value="Loader">Loader - Vehicle Loading Only</option>
                <option value="Viewer" selected>Viewer - Read Only Reports</option>
            </select>
        </div>
        <div class="form-group">
            <label>Phone (Optional)</label>
            <input type="text" name="phone" placeholder="Enter phone number">
        </div>
        <button type="submit" class="btn">✅ Create User</button>
    </form>
    
    <div class="footer">
        <a href="/login">← Back to Login</a> | <a href="/admin">Admin Panel</a>
    </div>
</div>
</body>
</html>
